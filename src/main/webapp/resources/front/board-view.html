<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시글 - 목깨비의 취업시장</title>
<link rel="stylesheet" href="css/style.css?v=20261106c">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
<header id="app-header"></header>
<div class="page-head">
  <div class="container">
    <nav class="breadcrumb" aria-label="현재 위치"><ol><li><a href="index.html">홈</a></li><li><a href="board.html">정보공유 게시판</a></li><li aria-current="page">게시글 보기</li></ol></nav>
    <h1>정보공유 게시판</h1>
  </div>
</div>
<main class="container page" id="main">
  <article id="view"></article>
</main>
<footer id="app-footer"></footer>
<script src="js/data.js?v=20261106c"></script>
<script src="js/app.js?v=20261106c"></script>
<script>
DK.renderChrome('board');
var id = +DK.qs('id');
var posts = DK.Posts.all();
var p = posts.filter(function (x) { return x.id === id; })[0];
var v = document.getElementById('view');
if (!p) {
  v.innerHTML = '<div class="empty">존재하지 않거나 삭제된 게시글입니다.<br><br><a class="btn secondary" href="board.html">목록으로</a></div>';
} else {
  var u = DK.Auth.current();
  /* 수정·삭제: 작성자 본인 또는 관리자 */
  var canEdit = !!u && (u.id === p.writerId || u.role === 'ADMIN');
  v.innerHTML = '<div class="post-head"><h2>' + DK.esc(p.title) + '</h2>' +
    '<dl class="post-info"><div><dt>구분</dt><dd>' + DK.Posts.catTag(p.category) + '</dd></div><div><dt>이름</dt><dd>' + DK.esc(p.writer) + '</dd></div><div><dt>날짜</dt><dd>' + DK.esc(p.date) + '</dd></div></dl></div>' +
    '<div class="post-body">' + DK.esc(p.content) + '</div>' +
    '<div class="post-actions"><div class="btn-row"><a class="btn secondary" href="board.html?cat=' + encodeURIComponent(p.category) + '">목록</a><button type="button" class="btn secondary" id="print">인쇄</button></div>' +
    (canEdit ? '<div class="btn-row"><a class="btn" href="board-form.html?id=' + p.id + '">수정</a><button type="button" class="btn danger" id="del">삭제</button></div>' : '') + '</div>';
  document.getElementById('print').addEventListener('click', function () { window.print(); });
  var d = document.getElementById('del');
  if (d) d.addEventListener('click', function () {
    DK.confirmBox('이 게시글을 삭제하시겠습니까?', function () {
      DK.Store.set(DK.K.posts, posts.filter(function (x) { return x.id !== id; }));
      DK.toast('게시글이 삭제되었습니다.', 'ok');
      setTimeout(function () { location.href = 'board.html'; }, 700);
    });
  });
}
</script>
</body>
</html>
