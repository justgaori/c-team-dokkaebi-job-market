<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시글 작성 - 목깨비의 취업시장</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="app-header"></header>
<main class="container page">
  <div class="card">
    <h1 id="head">글쓰기</h1>
    <form id="form" novalidate>
      <div class="field"><label for="title">제목</label><input type="text" id="title" maxlength="100"><div class="error-msg"></div></div>
      <div class="field"><label for="content">내용</label><textarea id="content" maxlength="2000"></textarea><div class="hint"><span id="cnt">0</span> / 2000자</div><div class="error-msg"></div></div>
      <div class="btn-row"><button class="btn" type="submit">저장</button><a class="btn secondary" id="cancel" href="board.html">취소</a></div>
    </form>
  </div>
</main>
<footer id="app-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
DK.renderChrome('board');
if (DK.Auth.require()) {
  var u = DK.Auth.current(), id = +DK.qs('id') || 0;
  var posts = DK.Store.get(DK.K.posts, []);
  var editing = id ? posts.filter(function (x) { return x.id === id; })[0] : null;
  var t = document.getElementById('title'), c = document.getElementById('content');
  if (id && !editing) { DK.toast('존재하지 않는 게시글입니다.', 'err'); setTimeout(function () { location.href = 'board.html'; }, 900); }
  else if (editing && !(editing.writerId === u.id || u.role === 'ADMIN')) { DK.toast('작성자 본인 또는 관리자만 수정할 수 있습니다.', 'err'); setTimeout(function () { location.href = 'board.html'; }, 1000); }
  else {
    if (editing) { document.getElementById('head').textContent = '글 수정'; t.value = editing.title; c.value = editing.content; document.getElementById('cancel').href = 'board-view.html?id=' + id; }
    var upd = function () { document.getElementById('cnt').textContent = c.value.length; };
    c.addEventListener('input', function () { upd(); if (c.value.trim()) DK.setErr(c, ''); }); t.addEventListener('input', function () { if (t.value.trim()) DK.setErr(t, ''); }); upd();
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var ok = true;
      if (!t.value.trim()) { DK.setErr(t, '제목을 입력해 주세요.'); ok = false; }
      if (!c.value.trim()) { DK.setErr(c, '내용을 입력해 주세요.'); ok = false; }
      if (!ok) { DK.toast('입력 내용을 확인해 주세요.', 'err'); return; }
      if (editing) {
        editing.title = t.value.trim(); editing.content = c.value;
        DK.Store.set(DK.K.posts, posts); DK.toast('게시글이 수정되었습니다.', 'ok');
        setTimeout(function () { location.href = 'board-view.html?id=' + id; }, 700);
      } else {
        var np = { id: DK.nextId(posts), title: t.value.trim(), content: c.value, writer: u.name, writerId: u.id, date: DK.today() };
        posts.push(np); DK.Store.set(DK.K.posts, posts); DK.toast('게시글이 등록되었습니다.', 'ok');
        setTimeout(function () { location.href = 'board-view.html?id=' + np.id; }, 700);
      }
    });
  }
}
</script>
</body>
</html>
