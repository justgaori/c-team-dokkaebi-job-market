<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 - 목깨비의 취업시장</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="app-header"></header>
<main class="container page">
  <div class="card auth-box">
    <h1>회원가입</h1>
    <form id="form" novalidate>
      <div class="field"><label for="id">아이디</label><input type="text" id="id" maxlength="20" autocomplete="username"><div class="hint">영문·숫자 4~20자</div><div class="error-msg"></div></div>
      <div class="field"><label for="pw">비밀번호</label><input type="password" id="pw" maxlength="50" autocomplete="new-password"><div class="hint">8자리 이상, 특수문자 1개 이상 포함</div><div class="error-msg"></div></div>
      <div class="field"><label for="name">이름</label><input type="text" id="name" maxlength="20" autocomplete="name"><div class="error-msg"></div></div>
      <div class="field"><label for="email">이메일</label><input type="email" id="email" maxlength="60" autocomplete="email"><div class="error-msg"></div></div>
      <button class="btn" style="width:100%" type="submit">가입하기</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:14px">이미 회원이신가요? <a href="login.html">로그인</a></p>
  </div>
</main>
<footer id="app-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
DK.renderChrome('signup');
var el = function (i) { return document.getElementById(i); };
var rules = {
  id: function (v) { return /^[A-Za-z0-9]{4,20}$/.test(v) ? '' : '아이디는 영문·숫자 4~20자로 입력해 주세요.'; },
  pw: function (v) { if (v.length < 8) return '비밀번호는 8자리 이상이어야 합니다.'; return /[^A-Za-z0-9\s]/.test(v) ? '' : '비밀번호에 특수문자를 1개 이상 포함해 주세요.'; },
  name: function (v) { return v.trim().length >= 2 ? '' : '이름을 2자 이상 입력해 주세요.'; },
  email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? '' : '올바른 이메일 형식이 아닙니다.'; }
};
/* 입력 즉시 검증(PER-001: 오류 메시지는 3초 이내) */
['id', 'pw', 'name', 'email'].forEach(function (k) {
  el(k).addEventListener('input', function () { DK.setErr(el(k), rules[k](el(k).value)); });
  el(k).addEventListener('blur', function () { if (el(k).value) DK.setErr(el(k), rules[k](el(k).value)); });
});
el('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var ok = true;
  ['id', 'pw', 'name', 'email'].forEach(function (k) { var m = rules[k](el(k).value); DK.setErr(el(k), m); if (m) ok = false; });
  if (!ok) { DK.toast('입력 내용을 확인해 주세요.', 'err'); return; }
  var users = DK.Store.get(DK.K.users, []);
  if (users.some(function (u) { return u.id.toLowerCase() === el('id').value.toLowerCase(); })) { DK.setErr(el('id'), '이미 사용 중인 아이디입니다.'); return; }
  users.push({ id: el('id').value, pw: el('pw').value, name: el('name').value.trim(), email: el('email').value.trim(), role: 'USER', interests: [] });
  DK.Store.set(DK.K.users, users);
  DK.toast('회원가입이 완료되었습니다. 로그인해 주세요.', 'ok');
  setTimeout(function () { location.href = 'login.html'; }, 900);
});
</script>
</body>
</html>
